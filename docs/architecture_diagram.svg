<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI Delivery Risk Assistant - System Architecture</title>
  <desc id="desc">Architecture diagram showing entrypoints, LangGraph pipeline modules, services, data stores, and outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2f6f"/>
      <stop offset="100%" stop-color="#283c86"/>
    </linearGradient>
    <linearGradient id="entry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe7ff"/>
      <stop offset="100%" stop-color="#c7d8ff"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f6f2e8"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7e2ff"/>
      <stop offset="100%" stop-color="#c0d2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d2555" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2a356f"/>
    </marker>
    <style>
      .title { font: 700 42px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #20306e; }
      .subtitle { font: 400 20px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #63749d; font-style: italic; }
      .section { font: 700 22px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #5d6f98; letter-spacing: 1px; }
      .box-title { font: 700 26px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1f2c66; }
      .box-sub { font: 400 18px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #55627f; }
      .core-title { font: 700 30px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .core-sub { font: 400 18px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #d4dcff; }
      .core-step { font: 400 21px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .core-foot { font: 400 18px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #d4dcff; font-style: italic; }
      .small { font: 400 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #58698d; }
      .tiny { font: 400 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #6a7696; }
      .code { font: 600 15px 'SFMono-Regular', 'Menlo', 'Consolas', monospace; fill: #31407c; }
      .panel { stroke: #2b366f; stroke-width: 3; rx: 20; ry: 20; filter: url(#shadow); }
      .core-panel { stroke: #24306a; stroke-width: 3; rx: 28; ry: 28; filter: url(#shadow); }
      .line { stroke: #2a356f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #6a7aa8; stroke-width: 2; fill: none; opacity: 0.45; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="68" text-anchor="middle" class="title">AI Delivery Risk Assistant - System Architecture</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">Entrypoints, refactored agent modules, pipeline stages, external services, and outputs</text>

  <!-- Section labels -->
  <text x="240" y="190" text-anchor="middle" class="section">ENTRYPOINTS</text>
  <text x="800" y="190" text-anchor="middle" class="section">CORE PIPELINE</text>
  <text x="1360" y="190" text-anchor="middle" class="section">SERVICES / STORES</text>
  <text x="800" y="930" text-anchor="middle" class="section">OUTPUTS</text>

  <!-- Left entrypoint boxes -->
  <rect x="70" y="230" width="340" height="96" rx="18" ry="18" fill="url(#entry)" class="panel"/>
  <text x="240" y="270" text-anchor="middle" class="box-title">Streamlit UI</text>
  <text x="240" y="298" text-anchor="middle" class="box-sub">app/ui.py - inspect, upload, run</text>

  <rect x="70" y="365" width="340" height="96" rx="18" ry="18" fill="url(#entry)" class="panel"/>
  <text x="240" y="405" text-anchor="middle" class="box-title">FastAPI</text>
  <text x="240" y="433" text-anchor="middle" class="box-sub">POST /run-audit</text>

  <rect x="70" y="500" width="340" height="96" rx="18" ry="18" fill="url(#entry)" class="panel"/>
  <text x="240" y="540" text-anchor="middle" class="box-title">CLI</text>
  <text x="240" y="568" text-anchor="middle" class="box-sub">src/cli_runner.py</text>

  <rect x="70" y="635" width="340" height="96" rx="18" ry="18" fill="url(#entry)" class="panel"/>
  <text x="240" y="675" text-anchor="middle" class="box-title">n8n Schedule Trigger</text>
  <text x="240" y="703" text-anchor="middle" class="box-sub">weekly automation + Notion delivery</text>

  <!-- Core panel -->
  <rect x="455" y="220" width="690" height="570" rx="28" ry="28" fill="url(#core)" class="core-panel"/>
  <text x="800" y="270" text-anchor="middle" class="core-title">LangGraph Deterministic State Machine</text>
  <text x="800" y="305" text-anchor="middle" class="core-sub">graph.py orchestrates the entire audit flow</text>

  <text x="515" y="360" class="core-step">1. Ingest documents from knowledge_base and uploads</text>
  <text x="515" y="405" class="core-step">2. Chunk into stable, citable evidence units</text>
  <text x="515" y="450" class="core-step">3. Embed chunks into project namespaces</text>
  <text x="515" y="495" class="core-step">4. Multi-angle retrieve and rerank candidate evidence</text>
  <text x="515" y="540" class="core-step">5. Extract up to 3 risks with structured OpenAI output</text>
  <text x="515" y="585" class="core-step">6. Validate citations, context, and contradiction grounding</text>
  <text x="515" y="630" class="core-step">7. Route to report, rejection, or HITL escalation</text>

  <line x1="515" y1="690" x2="1085" y2="690" class="line-soft"/>
  <text x="800" y="722" text-anchor="middle" class="core-foot">agent_analysis.py, agent_validation.py, agent_models.py</text>
  <text x="800" y="750" text-anchor="middle" class="core-foot">supported by config.py, prompts.py, and logger.py</text>

  <!-- Right service boxes -->
  <rect x="1170" y="230" width="360" height="96" rx="18" ry="18" fill="url(#service)" class="panel"/>
  <text x="1350" y="270" text-anchor="middle" class="box-title">OpenAI</text>
  <text x="1350" y="298" text-anchor="middle" class="box-sub">LLM extraction + embeddings</text>

  <rect x="1170" y="365" width="360" height="96" rx="18" ry="18" fill="url(#service)" class="panel"/>
  <text x="1350" y="405" text-anchor="middle" class="box-title">Pinecone</text>
  <text x="1350" y="433" text-anchor="middle" class="box-sub">per-project namespaces</text>

  <rect x="1170" y="500" width="360" height="96" rx="18" ry="18" fill="url(#service)" class="panel"/>
  <text x="1350" y="540" text-anchor="middle" class="box-title">Cohere Rerank</text>
  <text x="1350" y="568" text-anchor="middle" class="box-sub">rerank-v3.5</text>

  <rect x="1170" y="635" width="360" height="96" rx="18" ry="18" fill="url(#service)" class="panel"/>
  <text x="1350" y="675" text-anchor="middle" class="box-title">Telegram Bot API</text>
  <text x="1350" y="703" text-anchor="middle" class="box-sub">HITL approval alerts</text>

  <!-- Bottom outputs -->
  <rect x="210" y="965" width="300" height="92" rx="18" ry="18" fill="url(#output)" class="panel"/>
  <text x="360" y="1004" text-anchor="middle" class="box-title">Markdown Reports</text>
  <text x="360" y="1030" text-anchor="middle" class="box-sub">samples/*.md</text>

  <rect x="650" y="965" width="300" height="92" rx="18" ry="18" fill="url(#output)" class="panel"/>
  <text x="800" y="1004" text-anchor="middle" class="box-title">Notion Page</text>
  <text x="800" y="1030" text-anchor="middle" class="box-sub">via n8n workflow</text>

  <rect x="1090" y="965" width="300" height="92" rx="18" ry="18" fill="url(#output)" class="panel"/>
  <text x="1240" y="1004" text-anchor="middle" class="box-title">Telegram Alert</text>
  <text x="1240" y="1030" text-anchor="middle" class="box-sub">pending human review</text>

  <!-- Supporting data / config note -->
  <rect x="470" y="825" width="660" height="72" rx="18" ry="18" fill="#ffffff" opacity="0.9" stroke="#c8d4f1" stroke-width="2"/>
  <text x="800" y="855" text-anchor="middle" class="small">Supporting data: knowledge_base/, project_manifest.json, docs/ground_truth_risks.md</text>
  <text x="800" y="880" text-anchor="middle" class="tiny">refactor split keeps analysis and validation isolated while preserving the agent API facade</text>

  <!-- Arrows from entrypoints to core -->
  <line x1="410" y1="278" x2="455" y2="278" class="line"/>
  <line x1="410" y1="413" x2="455" y2="413" class="line"/>
  <line x1="410" y1="548" x2="455" y2="548" class="line"/>
  <line x1="410" y1="683" x2="455" y2="683" class="line"/>

  <!-- Arrows from core to services -->
  <line x1="1145" y1="278" x2="1170" y2="278" class="line"/>
  <line x1="1145" y1="413" x2="1170" y2="413" class="line"/>
  <line x1="1145" y1="548" x2="1170" y2="548" class="line"/>
  <line x1="1145" y1="683" x2="1170" y2="683" class="line"/>

  <!-- Arrows from core to outputs -->
  <line x1="700" y1="790" x2="390" y2="965" class="line"/>
  <line x1="800" y1="790" x2="800" y2="965" class="line"/>
  <line x1="900" y1="790" x2="1240" y2="965" class="line"/>

  <!-- Footer -->
  <text x="800" y="1070" text-anchor="middle" class="tiny">Solid arrows indicate primary data flow; n8n acts as the scheduled delivery layer while graph.py manages the deterministic audit path.</text>
</svg>
